# .github/workflows/ci.yml
name: CI (Lint & Test)

# Runs on pushes to key branches as per Section 7.2
on:
  push:
    branches:
      - 'feature/*'
      - 'develop'
      - 'main'
  pull_request:      # Also on PRs to see green check before accepting

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Install PNPM (Required for Moon to find the command)
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Install Node.js (Required by PNPM)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 3. Install Moonrepo
      - uses: moonrepo/setup-moon-action@v1

      # 4. Install Toolchain
      - name: Install Toolchain
        run: moon setup

      # 5. Code Validation (Lint) - Strict
      - name: Run Lint
        run: moon run :lint
        # continue-on-error: true  <-- Keep commented

      # 6. Unit Tests - Strict
      - name: Run Tests
        run: moon run :test
        # continue-on-error: true  <-- Keep commented