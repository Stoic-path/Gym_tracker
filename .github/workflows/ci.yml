# .github/workflows/ci.yml
name: CI (Lint & Test)

# Se ejecuta en pushes a cualquier rama clave para cumplir con la Sección 7.2
on:
  push:
    branches:
      - 'feature/*'  # 
      - 'develop'    # 
      - 'main'       # 
  pull_request:      # También en los PRs para ver el check verde antes de aceptar

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 1. Instalar PNPM (Vital para que Moon encuentre el comando)
      - uses: pnpm/action-setup@v4  # <--- NUEVO
        with:
          version: 9

      # 2. Instalar Node.js (Requerido por PNPM)
      - uses: actions/setup-node@v4 # <--- NUEVO
        with:
          node-version: '20'
          cache: 'pnpm'

      # 3. Instalar Moonrepo
      - uses: moonrepo/setup-moon-action@v1

      # 4. Instalar Toolchain
      - name: Install Toolchain
        run: moon setup

      # 5. Validar Código (Lint) - Estricto
      - name: Run Lint
        run: moon run :lint
        # continue-on-error: true  <-- Mantenlo comentado

      # 6. Pruebas Unitarias - Estricto
      - name: Run Tests
        run: moon run :test
        # continue-on-error: true  <-- Mantenlo comentado