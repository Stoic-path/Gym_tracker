$schema: 'https://moonrepo.dev/schemas/project.json'

type: 'application'
language: 'unknown'

tasks:
  
  test:
    command: 'python manage.py test'
    inputs:
      - '**/*.py'
      - 'requirements.txt'

  format:
    command: 'black . && isort .' 
    inputs:
      - '**/*.py'
    options:
      affectedFilesOnly: true 