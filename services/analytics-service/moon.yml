language: python
platform: python
type: application

tasks:
  dev:
    command: 'python manage.py runserver 0.0.0.0:8009' # Puerto 8009
    local: true
  makemigrations:
    command: 'python manage.py makemigrations analytics'
    platform: python
  install:
    command: 'pip install -r requirements.txt'
    inputs:
      - 'requirements.txt'
    platform: python
  lint:
    command: 'python manage.py check'
    inputs: ['**/*.py', 'requirements.txt']
  test:
    command: 'python manage.py test'
    inputs: ['**/*.py', 'requirements.txt']
