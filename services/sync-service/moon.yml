language: 'python'

type: 'application'

toolchain:
  python:
    version: '3.13.11'

tasks:
  # Local development task (moon run sync-service:dev)
  dev:
    command: 'python manage.py runserver 0.0.0.0:8000'
    local: true
    platform: 'system'

  # Linting task (moon run :lint)
  lint:
    command: 'python manage.py check'
    platform: 'system'

  # Testing task (moon run :test)
  test:
    command: 'python manage.py test'
    platform: 'system'
