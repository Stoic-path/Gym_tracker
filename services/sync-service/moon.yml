language: 'python'

type: 'application'

toolchain:
  python:
    version: '3.13.11'

tasks:
  # Tarea para desarrollo local (moon run auth-service:dev)
  dev:
    command: 'python manage.py runserver 0.0.0.0:8000'
    local: true
    platform: 'system'

  # Tarea de Linting (moon run :lint)
  lint:
    command: 'python manage.py check'
    platform: 'system'

  # Tarea de Pruebas (moon run :test)
  test:
    command: 'python manage.py test'
    platform: 'system'
