language: python
platform: python

type: application

tasks:
  dev:  # CAMBIADO de 'run' a 'dev' para estandarizar
    command: 'python manage.py runserver 0.0.0.0:8004'
    local: true
  makemigrations:
    command: 'python manage.py makemigrations exercises'
    platform: python
  install:
    command: 'pip install -r requirements.txt'
    inputs:
      - 'requirements.txt'
    platform: python

  lint:
    command: 'python manage.py check'
    inputs:
      - '**/*.py'
      - 'requirements.txt'

  test: # AGREGADO para estandarizar
    command: 'python manage.py test'
    inputs:
      - '**/*.py'
      - 'requirements.txt'