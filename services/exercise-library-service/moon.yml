language: python
platform: python

type: application

tasks:
  dev:  # CAMBIADO de 'run' a 'dev' para estandarizar
    command: 'python manage.py runserver 0.0.0.0:8004'
    local: true

  lint:
    command: 'python manage.py check'
    inputs:
      - '**/*.py'
      - 'requirements.txt'

  test: # AGREGADO para estandarizar
    command: 'python manage.py test'
    inputs:
      - '**/*.py'
      - 'requirements.txt'