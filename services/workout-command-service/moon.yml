language: python
platform: python
type: application

tasks:
  dev:
    command: 'python manage.py runserver 0.0.0.0:8002' # Puerto 8002
    local: true
  lint:
    command: 'python manage.py check'
    inputs: ['**/*.py', 'requirements.txt']
  test:
    command: 'python manage.py test'
    inputs: ['**/*.py', 'requirements.txt']
