language: python
platform: python  # <--- AGREGA ESTO SI FALTA

type: application

tasks:
  # Local development task (moon run routine-service:dev)
  dev:
    command: 'python manage.py runserver 0.0.0.0:8000'
    local: true
  makemigrations:
    command: 'python manage.py makemigrations routines'
    platform: python
  install:
    command: 'pip install -r requirements.txt'
    inputs:
      - 'requirements.txt'
    platform: python

  # Linting task (moon run :lint)
  lint:
    command: 'python manage.py check'
    inputs:
      - '**/*.py'
      - 'requirements.txt'
    

  # Testing task (moon run :test)
  test:
    command: 'python manage.py test'
    
