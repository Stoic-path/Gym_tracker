server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esta linea es la magia para React Router:
        # Si no encuentra el archivo, devuelve index.html (para que React maneje la ruta)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configuración para errores 500/404
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}