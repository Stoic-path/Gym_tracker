server {
    listen 80;
    server_name localhost;

    # --- FRONTEND (React) ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- BACKEND PROXIES (Simulating ALB Rules) ---
    
    # Instance #5: Access Group
    location /api/auth {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/users {
        proxy_pass http://user-profile-service:8002;
        proxy_set_header Host $host;
    }
    location /api/sync {
        proxy_pass http://sync-service:8009;
        proxy_set_header Host $host;
    }

    # Instance #6: Core Group
    location /api/workouts/command {
        proxy_pass http://workout-command-service:8003;
        proxy_set_header Host $host;
    }
    location /api/workouts/query {
        proxy_pass http://workout-query-service:8004;
        proxy_set_header Host $host;
    }
    location /api/routines {
        proxy_pass http://routine-service:8005;
        proxy_set_header Host $host;
    }
    location /api/exercises {
        proxy_pass http://exercise-library-service:8006;
        proxy_set_header Host $host;
    }

    # Instance #7: Heavy Group
    location /api/videos {
        proxy_pass http://video-service:8007;
        proxy_set_header Host $host;
    }
    location /api/notifications {
        proxy_pass http://notification-service:8008;
        proxy_set_header Host $host;
    }
    location /api/analytics {
        proxy_pass http://analytics-service:8010;
        proxy_set_header Host $host;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
