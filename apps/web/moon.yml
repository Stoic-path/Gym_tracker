# apps/web/moon.yml
type: 'application'
language: 'javascript'
platform: 'node'

tasks:
  # Development server (moon run web:dev)
  dev:
    command: 'vite'
    local: true

  # Production build (moon run web:build)
  build:
    command: 'vite build'
    outputs:
      - 'dist'

  # Linting (moon run web:lint)
  lint:
    command: 'eslint .'